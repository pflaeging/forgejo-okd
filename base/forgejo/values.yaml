global:
  compatibility:
    openshift:
      adaptSecurityContext: force
  # Storage settings will be overridden by environment-specific patches
  defaultStorageClass: local-path

replicaCount: 1

ingress:
  enabled: false  # Will be enabled by kubernetes platform overlay

route:
  enabled: false  # Will be enabled by openshift platform overlay

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 250m
    memory: 128Mi

initContainers:
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 64Mi

persistence:
  enabled: true
  # Storage settings will be overridden by environment-specific patches
  storageClass: local-path
  size: 2Gi
  claimName: forgejo-shared-storage
  accessModes: 
  - ReadWriteOnce

gitea:

  queue:
    TYPE: redis
    CONN_STR: redis+cluster://forgejo-valkey:6379/0

  cache:
    ADAPTER: redis
    HOST: redis+cluster://forgejo-valkey:6379/0

  session:
    PROVIDER: redis
    PROVIDER_CONFIG: redis+cluster://forgejo-valkey:6379/0

  config:
    database:
      DB_TYPE: postgres
      # paramters are set via env
    indexer:
      ISSUE_INDEXER_ENABLED: false
      # ISSUE_INDEXER_TYPE: db
      REPO_INDEXER_ENABLED: false
      # REPO_INDEXER:TYPE: db

test:
  enabled: false
#